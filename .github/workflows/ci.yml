name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No go.sum (no dependencies), so key the cache on go.mod.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: go test
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: build
        id: build
        run: go build -o godrycrap ./cmd/godrycrap

      # godrycrap exits 0 (ok), 1 (warn), 2 (fail) or 3 (error). Each report
      # passes on 0 and 1 and fails the job on 2 and 3, and every report runs
      # even when an earlier one failed.

      # Dogfood: GoDryCrap must pass its own bar on every function.
      - name: complexity (all functions)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          ./godrycrap complexity -summary ./cmd ./internal || status=$?
          [ "$status" -le 1 ] || exit "$status"

      - name: crap (all functions, own coverage)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          ./godrycrap crap -summary -coverprofile coverage.out ./cmd ./internal || status=$?
          [ "$status" -le 1 ] || exit "$status"

      - name: dupes (advisory)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          ./godrycrap dupes -summary ./cmd ./internal || status=$?
          [ "$status" -le 1 ] || exit "$status"

      - name: complexity (changed in this pull request)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          status=0
          ./godrycrap complexity -summary -diff "$BASE...HEAD" || status=$?
          [ "$status" -le 1 ] || exit "$status"

      - name: crap (changed in this pull request)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          status=0
          ./godrycrap crap -summary -coverprofile coverage.out -diff "$BASE...HEAD" || status=$?
          [ "$status" -le 1 ] || exit "$status"

      - name: dupes (changed in this pull request)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          status=0
          ./godrycrap dupes -summary -diff "$BASE...HEAD" || status=$?
          [ "$status" -le 1 ] || exit "$status"

  # Early warning for new Go releases. internal/coverlayout ports Go 1.27's
  # cmd/cover block rules, so a new Go minor may need the port re-checked
  # (see docs/STATUS.md). This job never fails the workflow.
  go-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.mod

      - name: go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      # A profile written by this Go must still match the cmd/cover layout
      # coverlayout computes; a mismatch here means the port needs a look.
      - name: crap on its own coverage (cmd/cover layout check)
        run: |
          go build -o godrycrap ./cmd/godrycrap
          status=0
          ./godrycrap crap -coverprofile coverage.out ./cmd ./internal || status=$?
          [ "$status" -le 1 ] || exit "$status"
